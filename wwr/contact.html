<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting | Contact Us</title>
    <meta name="description"
      content="Get in touch with White Water Rafting Co. for reservations, inquiries, or suggestions.">
    <meta name="author" content="Pemphero">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <div class="logo-box">
            <img src="images/profile.png" alt="White Water Rafting Co. logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>White Water Rafting Company</h1>

        <!-- Company Info + Map side by side -->
        <div class="contact-info">
            <div class="company-details">
                <p>
                    123 Main River Street<br>
                    Kolob, California<br>
                    +1 999 999 9999<br>
                    info@whitewater.com
                </p>
            </div>
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2404.1887464603737!2d-1.0962517184825054!3d52.94502674319095!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4879c405e51afd01%3A0x842b363a3885c500!2sWhite%20Water%20Rafting%20at%20Holme%20Pierrepont%20Country%20Park!5e0!3m2!1sen!2smw!4v1785503002988!5m2!1sen!2smw"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>


            </div>
        </div>

        <!-- Contact Form -->
        <section class="contact-form">
            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="placeholder">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="placeholder">

                <p>Purpose <br> Message</p>
                <label for="purpose-general">
                    <input type="radio" id="purpose-general" name="purpose" value="general"> General
                    Inquiry
                </label>
                <label for="purpose-reservation">
                    <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
                    Reservation Question
                </label>
                <label for="purpose-website">
                    <input type="radio" id="purpose-website" name="purpose" value="website"> Website
                    Suggestion
                </label>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"
                  placeholder="Type your message here"></textarea>

                <label for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter"> Subscribe me to the
                    monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <!-- Employee Profiles -->
        <section class="employees">
            <h2>We Are Here To Serve You</h2>
            <figure>
                <img src="images/employee1.jpg" alt="Lead Guide">
                <figcaption>John Doe – Lead Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.jpg" alt="Safety Coordinator">
                <figcaption>Jane Smith – Safety Coordinator</figcaption>
            </figure>
            <figure>
                <img src="images/employee3.jpg" alt="Trip Planner">
                <figcaption>Mike Brown – Trip Planner</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>© 2026 White Water Rafting Co. | Pemphero Douglass</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.jpg" alt="Facebook icon linking to our profile">
            </a>
            <a href="https://twitter.com">
                <img src="images/twitter.png" alt="Twitter logo linking to our feed">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram symbol linking to our gallery">
            </a>
        </nav>
    </footer>
</body>

</html>
